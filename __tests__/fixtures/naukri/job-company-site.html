<!--
  TEST FIXTURE. Approximates a signed-in Naukri job page whose apply slot is
  "Apply on company site" (#company-site-button, per open-source bots).
  UNVERIFIED against a logged-in live page — in particular whether the real
  button opens a new tab or navigates the same tab, and whether it goes through
  a Naukri redirect hop first. Both tab behaviours are simulated: default opens
  a popup, ?sametab=1 navigates the current tab.
-->
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Backend Engineer - Acme - 0 to 1 years - Naukri.com</title>
</head>
<body>
  <header><div class="nI-gNb-drawer__icon">Menu</div></header>
  <main>
    <section class="jd-header">
      <h1>Backend Engineer</h1>
      <a class="company">Acme</a>
      <div class="apply-button-container">
        <button id="company-site-button">Apply on company site</button>
      </div>
    </section>
  </main>
  <script>
    document.getElementById('company-site-button').addEventListener('click', function () {
      var target = 'https://jobs.lever.co/acme/5f1c2b7e-apply/apply';
      if (location.search.indexOf('sametab=1') !== -1) {
        location.href = target;
      } else {
        window.open(target, '_blank');
      }
    });
  </script>
</body>
</html>
