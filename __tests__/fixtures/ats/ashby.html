<script>
(function () {
  var MODE = new URLSearchParams(location.search).get('mode') || 'success';
  var CITIES = ['Bengaluru, Karnataka, India', 'Mumbai, Maharashtra, India', 'Berlin, Germany'];

  // yes/no buttons
  document.querySelectorAll('.ashby-application-form-input-yesno').forEach(function (group) {
    var box = group.querySelector('input');
    group.querySelectorAll('button[aria-pressed]').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.preventDefault();
        group.querySelectorAll('button[aria-pressed]').forEach(function (b) { b.setAttribute('aria-pressed', 'false'); });
        btn.setAttribute('aria-pressed', 'true');
        box.checked = btn.getAttribute('data-option') === 'yes';
        box.setAttribute('data-answered', btn.getAttribute('data-option'));
      });
    });
  });

  // async location autocomplete: no options until typed
  var locContainer = document.getElementById('loc-container');
  var loc = locContainer.querySelector('input');
  var listbox = null;
  function closeLoc() { if (listbox) { listbox.remove(); listbox = null; } loc.setAttribute('aria-expanded', 'false'); }
  loc.addEventListener('input', function () {
    closeLoc();
    var q = loc.value.trim().toLowerCase();
    if (!q) return;
    setTimeout(function () {
      closeLoc();
      listbox = document.createElement('ul');
      listbox.className = 'loc-listbox';
      listbox.setAttribute('role', 'listbox');
      CITIES.filter(function (c) { return c.toLowerCase().indexOf(q) === 0; }).forEach(function (c) {
        var li = document.createElement('li');
        li.setAttribute('role', 'option');
        li.textContent = c;
        li.addEventListener('mousedown', function (e) { e.preventDefault(); });
        li.addEventListener('click', function () { loc.value = c; closeLoc(); });
        listbox.appendChild(li);
      });
      locContainer.appendChild(listbox);
      loc.setAttribute('aria-expanded', 'true');
    }, 150);
  });
  loc.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeLoc(); });

  function collect() {
    var root = document.getElementById('form');
    var out = {};
    root.querySelectorAll('input, textarea').forEach(function (el) {
      if (el.closest('.ashby-application-form-autofill-uploader')) {
        if (el.files && el.files.length) out.autofill_used = true;
        return;
      }
      if (el.type === 'file') { out[el.id] = Array.prototype.map.call(el.files, function (f) { return f.name; }); return; }
      if (el.type === 'radio') { if (el.checked) out[el.name] = el.id; return; }
      if (el.type === 'checkbox') { out[el.name] = el.getAttribute('data-answered') || ''; return; }
      out[el.name || el.id || 'location'] = el.value;
    });
    return out;
  }

  document.querySelector('.ashby-application-form-submit-button').addEventListener('click', function (e) {
    e.preventDefault();
    fetch('/__hw/submit', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(collect()) })
      .then(function () {
        if (MODE === 'success') {
          document.getElementById('form').innerHTML =
            '<div class="ashby-application-form-success-container"><h2>Thank you for applying</h2>' +
            '<p>Your application was successfully submitted.</p></div>';
        } else if (MODE === 'validation') {
          var err = document.querySelector('.ashby-application-form-errors');
          err.textContent = 'Your form needs corrections: Email is not a valid email address';
          err.style.display = 'block';
        } else if (MODE === 'captcha') {
          var w = document.getElementById('rc-wrap');
          w.style.visibility = 'visible';
          w.style.top = '10px';
        }
      });
  });
})();
</script>
</body>
</html>
